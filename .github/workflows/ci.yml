# CI pipeline — P1 fix item 6
# Runs on every push and pull_request targeting main.
# Gate: ruff lint + pytest (full regression).  No merge without green CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # PySide6 wheels dlopen Qt's shared libraries (libEGL, libGL, ...),
      # which a bare ubuntu runner does not ship. Without them every test
      # importing npsc_gui fails at import time (libEGL.so.1: cannot open).
      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # ruff is pinned to the exact version the lint gate was validated
          # with (local + CI parity); bump deliberately, never implicitly.
          pip install pytest pytest-cov ruff==0.16.9

      - name: Lint (ruff — errors + warnings, ignore line-length)
        run: ruff check src/ tests/ integrations/hermes/ scripts/install_hermes_context.py tools/benchmark_agent_context.py tools/benchmark_extractive_context.py tools/benchmark_specialized_engines.py --select E,F,W --ignore E501

      - name: Agent-context regression (independent of GUI)
        timeout-minutes: 3
        run: |
          python -m pytest -q --tb=short \
            tests/test_agent_context.py tests/test_hermes_context_adapter.py tests/test_agent_context_benchmark.py \
            tests/test_code_protection.py tests/test_compact_cli.py \
            tests/test_compaction_verifier.py tests/test_compression_policy.py \
            tests/test_context_compactor.py tests/test_conversation_store.py tests/test_summarizer.py tests/test_local_summary.py tests/test_hermes_hybrid.py tests/test_extractive_context.py tests/test_extractive_benchmark.py tests/test_nscp_resources.py tests/test_semantic_memory.py tests/test_specialized_benchmark.py
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen

      - name: Synthetic context benchmark (structural, no model)
        timeout-minutes: 3
        run: |
          python tools/benchmark_agent_context.py
          python tools/benchmark_extractive_context.py
        env:
          PYTHONPATH: src

      - name: Run tests (full regression, short tracebacks, coverage)
        if: always()
        timeout-minutes: 10
        run: |
          python -m pytest tests/ --tb=short -q -o faulthandler_timeout=90 \
            --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: src
          # Headless runner: no display server, use Qt's offscreen plugin.
          QT_QPA_PLATFORM: offscreen
